name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          go build -v -trimpath -o dist/wings wings.go
          chmod 755 dist/wings

      - name: Vet
        run: go vet ./...
        continue-on-error: true

      - name: Test
        run: go test ./... -v

      - name: Test (race)
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: wings_linux_amd64
          path: dist/wings

  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint chart/pelican-wings

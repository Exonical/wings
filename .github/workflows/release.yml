name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
          GOOS: linux
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            GOARCH="${arch}" go build -v -trimpath \
              -ldflags="-s -w -X github.com/exonical/wings/system.Version=${VERSION}" \
              -o "dist/wings_linux_${arch}" \
              wings.go
            chmod 755 "dist/wings_linux_${arch}"
          done

      - name: Create checksums
        run: |
          cd dist && sha256sum wings_linux_amd64 wings_linux_arm64 > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: true
          files: |
            dist/wings_linux_amd64
            dist/wings_linux_arm64
            dist/checksums.txt
